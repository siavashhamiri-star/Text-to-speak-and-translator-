name: Android CI & Release Build

on:
  push:
    branches:
      - main
      - master
  pull_request:
    branches:
      - main
      - master
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build & Test Android Artifacts
    runs-on: ubuntu-latest
    timeout-minutes: 45

    env:
      ANDROID_HOME: ${{ runner.temp }}/android-sdk
      ANDROID_SDK_ROOT: ${{ runner.temp }}/android-sdk

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set Up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android Command Line Tools
        run: |
          mkdir -p "$ANDROID_HOME/cmdline-tools"

          wget -q \
            https://dl.google.com/android/repository/commandlinetools-linux-12266719_latest.zip \
            -O "$RUNNER_TEMP/cmdline-tools.zip"

          unzip -q "$RUNNER_TEMP/cmdline-tools.zip" -d "$RUNNER_TEMP"

          mv "$RUNNER_TEMP/cmdline-tools" \
            "$ANDROID_HOME/cmdline-tools/latest"

          echo "$ANDROID_HOME/cmdline-tools/latest/bin" >> "$GITHUB_PATH"
          echo "$ANDROID_HOME/platform-tools" >> "$GITHUB_PATH"

      - name: Accept Android SDK Licenses
        run: |
          yes | sdkmanager --licenses

      - name: Install Android SDK Packages
        run: |
          sdkmanager \
            "platform-tools" \
            "platforms;android-34" \
            "build-tools;34.0.0"

      - name: Verify Android SDK
        run: |
          sdkmanager --list_installed

      - name: Grant Gradle Permission
        run: |
          chmod +x ./gradlew

      - name: Validate Gradle
        run: |
          ./gradlew --version

      - name: Run Unit Tests
        run: |
          ./gradlew test

      - name: Build Debug APK
        run: |
          ./gradlew assembleDebug

      - name: Build Release APK and AAB
        run: |
          ./gradlew assembleRelease bundleRelease

      - name: Locate Build Artifacts
        if: always()
        run: |
          echo "APK files:"
          find . -type f -name "*.apk" || true

          echo "AAB files:"
          find . -type f -name "*.aab" || true

      - name: Upload Android Artifacts
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: Side-by-Side-Android-Build
          path: |
            **/build/outputs/apk/**/*.apk
            **/build/outputs/bundle/**/*.aab
          if-no-files-found: error
          retention-days: 14
