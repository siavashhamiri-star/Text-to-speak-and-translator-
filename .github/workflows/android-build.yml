name: Android CI & Release Build

on:
  push:
    branches:
      - main
      - master
  pull_request:
    branches:
      - main
      - master
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build & Test Android Artifacts
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set Up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # اینجا به جای استفاده از اکشن‌های خراب، کاملاً لایسنس‌ها رو با دستور محیطی دور می‌زنیم
      - name: Fast-track Android Setup & License Bypass
        run: |
          mkdir -p $HOME/android-sdk/licenses
          echo "8933bad161af4178b1185d1a37fbf41ea5269c55" > $HOME/android-sdk/licenses/android-sdk-license
          echo "d56f5187479451eabf01fb78af6dfcb131a648b0" >> $HOME/android-sdk/licenses/android-sdk-license
          echo "24333f8a43b681623c8ab30fa1963b3821c13395" >> $HOME/android-sdk/licenses/android-sdk-license
          echo "sdk.dir=$HOME/android-sdk" > local.properties

      - name: Grant Gradle Permission
        run: |
          chmod +x ./gradlew

      - name: Build Release APK and AAB
        run: |
          ./gradlew assembleRelease bundleRelease

      - name: Upload Android Artifacts
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: Side-by-Side-Android-Build
          path: |
            **/build/outputs/apk/**/*.apk
            **/build/outputs/bundle/**/*.aab
          if-no-files-found: error
          retention-days: 14
          
